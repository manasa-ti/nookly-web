<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0a18"></stop>
      <stop offset="1" stop-color="#06030c"></stop>
    </linearGradient>
    <radialGradient id="dot" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c4b5fd"></stop>
      <stop offset="0.5" stop-color="#8b5cf6"></stop>
      <stop offset="1" stop-color="#6d28d9"></stop>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"></stop>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"></stop>
    </radialGradient>
  </defs>
  <rect width="500" height="500" rx="112" fill="url(#bg)"></rect>
  <circle cx="250" cy="250" r="220" fill="url(#glow)"></circle>
  <g stroke-linecap="round" fill="none">
    <circle cx="250" cy="250" r="170" stroke="#8b5cf6" stroke-opacity="0.18" stroke-width="2"></circle>
    <circle cx="250" cy="250" r="125" stroke="#8b5cf6" stroke-opacity="0.30" stroke-width="2"></circle>
    <circle cx="250" cy="250" r="82" stroke="#8b5cf6" stroke-opacity="0.55" stroke-width="2.5"></circle>
  </g>
  <circle cx="250" cy="250" r="46" fill="url(#dot)"></circle>
</svg>